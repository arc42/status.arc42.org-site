---
name: Build and Deploy Jekyll Site

"on":
  # Redeploy on demand (`gh workflow run pages.yml`). Since Pages builds from
  # this workflow rather than from the branch, this is the only way to publish
  # the site again without changing a file under docs/.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these
# production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ./docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # What the footer reports as this site's build. The commit is the one
      # being deployed, the date is when it was deployed; the release number
      # beside them is site.version in _config.yml. The file is gitignored:
      # only a deploy writes it, so a local build never claims to be one.
      - name: Record the build
        run: |
          printf 'sha: %s\ndeployed: %s\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > docs/_data/build.yml
          cat docs/_data/build.yml

      - name: Build with Jekyll
        run: |
          cd docs
          bundle exec jekyll build --baseurl \
            "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
