# The arc42 family, one record per property.
# --------------------------------------------------------------------------
# Single source of truth for the per-site subpages at /site/<host>/. Each page
# under _pages/site-*.md is a stub carrying nothing but `host:`; every fact
# below is looked up from here, so a changed repo name or a re-issued Plausible
# token is a one-line edit in one file.
#
# `plausible_embed` is the *verbatim* share URL that used to sit in the front
# matter of home.md. Where the field is absent the property genuinely has no
# Plausible share link -- the subpage then says so in words rather than
# rendering an empty frame. No token is ever invented (ADR-0002: report what
# was measured, not what would be convenient).
#
# `hue` is documentation only: the rendering authority is
# assets/css/arc42-status-style.css, keyed on data-site, per ADR-0003
# (brand values enter a site as CSS custom properties, never as data).

- host: arc42.org
  name: arc42
  tagline: The flagship. Method, template, downloads.
  role: hub
  url: https://www.arc42.org
  repo: https://github.com/arc42/arc42.org-site
  hue: "hub navy #374769, band #2b3a57"
  plausible_embed: "https://plausible.io/share/arc42.org?auth=tNNpNN0VqPh9xbjkaEPrx&embed=true&theme=light"

