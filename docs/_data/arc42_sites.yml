# The arc42 family, one record per property.
# --------------------------------------------------------------------------
# Single source of truth for the per-site subpages at /site/<key>/. Each page
# under _pages/site-*.md is a stub carrying nothing but `key:`; every fact below
# is looked up from here, so a changed repo name or a re-issued Plausible token
# is a one-line edit in one file.
#
# `key` is the property identifier, and it is the same string the Go service
# uses: it is the tile's data-site value, the /site/<key>/ segment, and the
# ?site= parameter of /siteDetail. For sites it is the host; for a repository
# with no site of its own (arc42-template) it is the repository name. The two
# lists have to agree -- see types.Arc42properties in go-app.
#
# `host` is absent when the property has no website. The subpage then offers no
# "visit the site" link rather than inventing one.
#
# `plausible_embed` is the *verbatim* share URL that used to sit in the front
# matter of home.md. Where the field is absent the property genuinely has no
# Plausible share link -- the subpage then says so in words rather than
# rendering an empty frame. No token is ever invented (ADR-0002: report what
# was measured, not what would be convenient).
#
# `in_table` mirrors the Go service's InTable flag and is documentation only:
# the table is rendered by the service, not by Jekyll. It is here so this file
# still describes the family completely.
#
# The record order is the DISPLAY order, and it mirrors types.Arc42properties in
# go-app: the tiles come from the service in that order and the index at the
# bottom of the home page is rendered from this file, so the two have to agree.
# `planned: true` marks a property that does not exist yet.
#
# `hue` is documentation only: the rendering authority is
# assets/css/arc42-status-style.css, keyed on data-site, per ADR-0003
# (brand values enter a site as CSS custom properties, never as data).

- key: arc42.org
  host: arc42.org
  name: arc42
  tagline: The flagship. Method, template, downloads.
  role: hub
  in_table: true
  url: https://www.arc42.org
  repo: https://github.com/arc42/arc42.org-site
  hue: "hub navy #374769, band #2b3a57"
  plausible_embed: "https://plausible.io/share/arc42.org?auth=tNNpNN0VqPh9xbjkaEPrx&embed=true&theme=light"

- key: arc42.de
  host: arc42.de
  name: arc42 (deutsch)
  tagline: Der Hub-Zwilling. Same method, German voice.
  role: hub
  in_table: true
  url: https://www.arc42.de
  repo: https://github.com/arc42/arc42.de-site
  hue: "hub navy #374769, band #2b3a57"
  plausible_embed: "https://plausible.io/share/arc42.de?auth=IYzUmMI8s2PYKgggJhO7q&embed=true&theme=light"

